# Base de datos MySQL con almacenamiento persistente e inicialización automática.
services:
  db:
    image: mysql:8.4
    container_name: miflix-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  # Interfaz web de administración, publicada en el puerto indicado en .env.
  adminer:
    image: adminer:4.8.1-standalone
    container_name: miflix-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend

# Aplicación Tomcat: solo recibe la ruta de medios interna y la monta en solo lectura.
  app:
    build: .
    container_name: miflix-app
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MEDIA_PATH: /media
    volumes:
      - "${MEDIA_PATH}:/media:ro"
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

# backend aísla los servicios; frontend permite publicar Adminer al host.
networks:
  backend:
    internal: true
  frontend:
    driver: bridge

# Volumen nombrado para conservar los datos entre reinicios.
volumes:
  db_data: